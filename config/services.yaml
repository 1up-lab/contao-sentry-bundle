services:
    oneup_contao_sentry.twig.extension:
        class: Oneup\ContaoSentryBundle\Twig\ContaoSentryTwigExtension
        tags:
            - { name: twig.extension }

    oneup_contao_sentry.twig.runtime:
        class: Oneup\ContaoSentryBundle\Twig\ContaoSentryTwigRuntime
        public: false
        tags:
            - { name: twig.runtime }

    oneup_contao_sentry.dispatch_before_send_event_callback:
        class: Oneup\ContaoSentryBundle\DispatchBeforeSendEventCallback
        arguments:
            - '@event_dispatcher'
